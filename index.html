<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف - محمود & اسماء</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcf9f2;
            --primary-color: #4a1525;
            --accent-color: #c5a059;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .phone-container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-color);
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        /* شاشة الظرف */
        #envelope-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
            padding: 20px;
            text-align: center;
        }

        .envelope {
            width: 280px;
            height: 180px;
            background: #d8c2a3;
            position: relative;
            border-radius: 5px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 100px solid #c4ab8c;
            transform-origin: top;
            transition: transform 0.6s ease;
        }

        .envelope.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .letter {
            position: absolute;
            width: 240px;
            height: 140px;
            background: white;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            transition: transform 0.8s ease 0.4s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            border-radius: 4px;
        }

        .envelope.open .letter {
            transform: translateY(-90px);
        }

        .envelope-screen h2 {
            font-family: 'Amiri', serif;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 24px;
        }

        .envelope-screen p {
            color: #666;
            font-size: 14px;
        }

        /* المحتوى الرئيسي */
        .main-content {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .main-content.show {
            display: flex;
            opacity: 1;
        }

        .names {
            font-family: 'Amiri', serif;
            font-size: 32px;
            color: var(--primary-color);
            margin: 15px 0 5px 0;
            font-weight: 700;
            text-align: center;
        }

        .date-sub {
            font-size: 15px;
            color: #666;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* العد التنازلي */
        .countdown-section {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            margin-bottom: 25px;
            text-align: center;
        }

        .countdown-title {
            font-family: 'Amiri', serif;
            color: var(--primary-color);
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .countdown-boxes {
            display: flex;
            justify-content: space-around;
            gap: 8px;
        }

        .c-box {
            background: var(--bg-color);
            padding: 8px;
            border-radius: 8px;
            flex: 1;
            text-align: center;
            border: 1px solid #eee;
        }

        .c-box span {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .c-box label {
            font-size: 11px;
            color: #777;
        }

        /* قسم الذكريات والخصوصية */
        .privacy-note {
            background: #fff8eb;
            border: 1px dashed var(--accent-color);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .timeline-card {
            background: white;
            width: 100%;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        .timeline-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .timeline-date {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .timeline-text {
            font-size: 14px;
            color: #444;
        }
    </style>
</head>
<body>

        <div id="envelope-screen">
            <div class="envelope" id="env">
                <div class="envelope-flap"></div>
                <div class="letter">
                    <h3 style="font-family: 'Amiri'; color: #4a1
